{% extends "base.html" %}
{% block title %}Create account | CarbonWise AI{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-2xl border border-slate-200 bg-white p-7 shadow-sm sm:p-9">
  <span class="text-xs font-bold uppercase tracking-widest text-emerald-700">Get started</span>
  <h1 class="mt-2 text-3xl font-extrabold text-slate-900">Create your account</h1>
  <p class="mt-2 text-sm text-slate-500">Register to evaluate steel product carbon emissions.</p>
  {% if error %}<div class="mt-4 rounded-lg bg-rose-50 p-3 text-sm text-rose-700">{{ error }}</div>{% endif %}
  <form method="post" action="{% url 'signup' %}" class="mt-6 space-y-4">
    {% csrf_token %}
    <div><label class="mb-1 block text-sm font-medium" for="full_name">Full name</label><input id="full_name" name="full_name" required class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-emerald-600 focus:outline-none" placeholder="Your full name"></div>
    <div><label class="mb-1 block text-sm font-medium" for="username">Username</label><input id="username" name="username" required autocomplete="username" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-emerald-600 focus:outline-none" placeholder="Choose a username"></div>
    <div><label class="mb-1 block text-sm font-medium" for="email">Work email (optional)</label><input id="email" name="email" type="email" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-emerald-600 focus:outline-none" placeholder="you@company.com"></div>
    <div><label class="mb-1 block text-sm font-medium" for="company">Company / steel mill (optional)</label><input id="company" name="company" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-emerald-600 focus:outline-none" placeholder="Company name"></div>
    <div class="grid gap-4 sm:grid-cols-2">
      <div><label class="mb-1 block text-sm font-medium" for="password1">Password</label><input id="password1" name="password1" type="password" required autocomplete="new-password" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-emerald-600 focus:outline-none" placeholder="Create password"></div>
      <div><label class="mb-1 block text-sm font-medium" for="password2">Confirm password</label><input id="password2" name="password2" type="password" required autocomplete="new-password" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-emerald-600 focus:outline-none" placeholder="Repeat password"></div>
    </div>
    <button type="submit" class="w-full rounded-xl bg-emerald-700 px-4 py-3 font-semibold text-white hover:bg-emerald-800">Create account</button>
  </form>
  <p class="mt-5 text-center text-sm text-slate-600">Already registered? <a href="{% url 'login' %}" class="font-semibold text-emerald-700 hover:underline">Sign in</a></p>
</section>
{% endblock %}
